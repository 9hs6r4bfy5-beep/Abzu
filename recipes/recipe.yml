# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: abzu
description: An elegant, powerful operating system for desktops, workstations and homelabs that honours and preserves the ancient traditions.

base-image: ghcr.io/secureblue/silverblue-main-hardened
image-version: 44

modules:
  # Enable RPM Fusion BEFORE the dnf module runs.
  - type: script
    scripts:
      - enable-rpmfusion.sh

  - type: dnf
    repos:
      copr:
        - name: bieszczaders/kernel-cachyos-addons
          chroot: fedora-44-x86_64
        - name: atim/starship
          chroot: fedora-44-x86_64
    install:
      packages:
        # Base build tools and dependencies
        - git
        - wget
        - gcc
        - gcc-c++
        - make
        - mactel-boot
        - rEFInd
        - podman
        - podman-compose
        - cmake
        - ninja-build
        - pkgconf-pkg-config
        - wayland-devel
        - avahi-devel
        - glib2-devel
        - gtk3-devel
        - gtk-layer-shell-devel
        - libnotify-devel
        - npm
        - zip
        - fuse
        - fuse-libs
        - fuse-devel
        - R
        - python3-devel
        - python3-pip
        - libxml2-devel
        - libcurl-devel
        - libpng-devel
        - freetype-devel
        - harfbuzz-devel
        - fribidi-devel
        - libtiff-devel
        - libffi-devel
        - libjpeg-turbo-devel
        - openssl-devel
        - ffmpeg-free
        - libdiscid
        - libchromaprint
        - redhat-rpm-config
        - curl
        - wine
        - winetricks
        - p7zip
        - unzip
        - desktop-file-utils
        - gnutls
        - gnutls.i686
        - xz
        - dconf-editor
        - gnome-tweaks
        - scx-scheds
        - scx-tools
        - jq
        - policycoreutils-python-utils
        - gdisk
        - dosfstools
        - ntfs-3g
        - exfatprogs
        # Fonts and utilities
        - gdouros-akkadian-fonts
        - sassc
        - gtk2-engines
        - gtk-murrine-engine
        # GNOME Online Accounts and Evolution for CalDAV/CardDAV
        - gnome-online-accounts
        - evolution
        - evolution-data-server
        # Sumerian / Cuneiform tools
        - yagf
        # ibus dependencies for cuneiform input method
        - ibus
        - ibus-table
        # Build tools for Tauri
        - nodejs
        - cargo
        - rust
        - webkit2gtk4.1-devel
        - libappindicator-gtk3-devel
        - librsvg2-devel
        - libxdo-devel
        - file
        # Build dependencies for Snow
        - alsa-lib-devel
        # Shell and editor tools
        - micro
        - starship
        # Broadcom wl kernel module (from RPM Fusion nonfree)
        - akmod-wl

  - type: kargs
    kargs:
      - preempt=full
      - mitigations=auto
      - threadirqs
      - init_on_alloc=1
      - init_on_free=1
      - hash_pointers=always
      - page_alloc.shuffle=1
      - randomize_kstack_offset=on
      - iommu=force
      - intel_iommu=on
      - iommu.passthrough=0
      - iommu.strict=1
      - lockdown=confidentiality
      - module.sig_enforce=1
      - l1d_flush=on
      - l1tf=full,force
      - spec_store_bypass_disable=on
      - spectre_v2=on
      - ssbd=force-on
      - slab_debug=FZ
      - slab_nomerge
      - random.trust_bootloader=off
      - random.trust_cpu=off
      - rd.shell=0
      - rd.emergency=halt

  - type: files
    files:
      - source: system
        destination: /
      - source: etc/skel
        destination: /etc/skel
      - source: etc/flatpak/overrides/ai.lmstudio.lm-studio
        destination: /etc/flatpak/overrides/ai.lmstudio.lm-studio

  - type: systemd
    system:
      enabled:
        - scx_loader.service

  - type: script
    scripts:
      - theming.sh
      - install-intel-sde.sh
      - install-apple2pi.sh
      - install-tether.sh
      - install-hotline.sh
      - install-snow.sh
      - install-fono.sh
      - install-icloud-linux.sh
      - install-cunai.sh
      - install-smb-remastered.sh
      - install-beets.sh
      - zaparoo.sh
      - configure-stellarium.sh
      - install-ibus-cuneiform.sh
      - install-sumer-r-package.sh
      - install-daggerfall-unity.sh
      - install-soh.sh
      - install-2s2h.sh
      - install-samodmanager.sh

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - app.twintaillauncher.ttl
          - io.github.jeffshee.Hidamari
          - net.waterfox.waterfox
          - org.torproject.torbrowser-launcher
          - org.freedownloadmanager.Manager
          - io.github.diegopvlk.Dosage
          - org.gnuhealth.mygnuhealth
          - org.gnome.clocks
          - org.gnome.Weather
          - io.github.heidefinnischen.cuneo
          - app.gmtp.gMTP
          - org.strawberrymusicplayer.Strawberry
          - as.may.moat
          - io.github.kolunmi.Bazaar
          - org.gnome.Loupe
          - com.visualstudio.code
          - ai.lmstudio.lm-studio
          - com.valvesoftware.Steam
          - com.valvesoftware.Steam.CompatibilityTool.Proton
          - com.valvesoftware.Steam.Utility.steamtinkerlaunch
          - com.steamgriddb.SGDBoop
          - org.openmw.OpenMW
          - com.infochunk.OpenMadoola
          - io.jor.nanosaur
          - io.jor.nanosaur2
          - io.github.hedge_dev.hedgemodmanager
          - com.epicgames.ut99
          - com.epicgames.ut2004
          - com.vysp3r.ProtonPlus
          - com.github.Matoking.protontricks
          - io.github.sharkwouter.Minigalaxy
          - com.discordapp.Discord
          - org.lyx.LyX
          - dk.gqrx.gqrx
          - org.audacityteam.Audacity
          - org.kde.krita
          - org.kde.haruna
          - org.stellarium.Stellarium
      - scope: user

  - type: initramfs
  - type: signing
