---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: Abzû
# description will be included in the image's metadata
description: An elegant, powerful operating system for desktops, workstations and homelabs that honours and preserves the ancient traditions.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/secureblue/silverblue-main-hardened
image-version: latest # You can pin to a specific version of Fedora as well

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
- type: rpm-ostree
   install:
      # Base build tools and dependencies
      - git
      - wget
      - R
      - libxml2-devel
      - openssl-devel
      - libcurl-devel
      - libpng-devel
      - freetype-devel
      - harfbuzz-devel
      - fribidi-devel
      - libtiff-devel
      - libjpeg-turbo-devel
      - curl
      - unzip
      - dconf-editor
      - gnome-tweaks
      - gnome-shell-extensions
      # Fonts and utilities
      - gdouros-akkadian-fonts
      - sassc
      - gtk-murrine-engine
      - gnome-themes-extra
      # Hardware Support
      - akmod-wl
      - akmod-nvidia
      # Other packages
      - intel-sde
      # Sumerian / Cuneiform tools
      - yagf
      - cuneiform-qt
      - gdouros-akkadian-fonts
      # ibus dependencies for cuneiform input method
      - ibus
      - ibus-table
      - make
      - python3
      # Build tools for Tauri
      - nodejs
      - npm
      - cargo
      - rust
      - webkit2gtk4.1-devel
      - openssl-devel
      - libappindicator-gtk3-devel
      - librsvg2-devel
      - gtk3-devel
      - libxdo-devel
      - file
      # Build dependencies for Snow
      - alsa-lib-devel
      - pkgconf-pkg-config
      
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /
      - source: etc/dconf/db/local.d/00-macos-themes
        destination: /etc/dconf/db/local.d/00-macos-themes
        
 - type: script
    scripts:
      - theming.sh
      - install-hotline.sh
      - install-snow.sh
      - configure-stellarium.sh
      - install-ibus-cuneiform.sh
      - install-sumer-r-package.sh
  - type: dnf
    repos:
      copr:
        - atim/starship
        
    install:
      packages:
        - micro
        - starship
    remove:
      packages: 
        - firefox
        - firefox-langpacks

  - type: default-flatpaks
    configurations:
      - notify: true # Send notification after install/uninstall is finished (true/false)
        scope: system
        # If no repo information is specified, Flathub will be used by default
        install: # system flatpaks we want all users to have and not remove
          - app.twintaillauncher.ttl
          - net.waterfox.waterfox
          - org.torproject.torbrowser-launcher
          - org.freedownloadmanager.Manager
          - org.gnome.Loupe
          - com.visualstudio.code
          - com.valvesoftware.Steam
          - com.valvesoftware.Steam.CompatibilityTool.Proton
          - com.valvesoftware.Steam.Utility.steamtinkerlaunch
          - com.vysp3r.ProtonPlus
          - com.github.Matoking.protontricks
          - com.discordapp.Discord
          - org.lyx.LyX
          - dk.gqrx.gqrx
          - org.audacityteam.Audacity
          - org.kde.krita
          - org.kde.haruna
          - org.stellarium.Stellarium
          
      - scope: user # Also add Flathub user repo, but no user packages

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
