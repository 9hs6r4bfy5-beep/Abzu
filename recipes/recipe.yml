# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: abzu
description: An elegant, powerful operating system for desktops, workstations and homelabs that honours and preserves the ancient traditions.
base-image: ghcr.io/ublue-os/bluefin
image-version: stable

modules:
  # Enable RPM Fusion BEFORE the dnf module runs.
  - type: script
    scripts:
      - enable-rpmfusion.sh

  - type: dnf
    repos:
      copr:
        - name: bieszczaders/kernel-cachyos-addons
          chroot: fedora-44-x86_64
        - name: atim/starship
          chroot: fedora-44-x86_64
    install:
      packages:
        # ... (all your packages remain unchanged) ...
        - b43-firmware

  - type: kargs
    kargs:
      # ... (all your kernel arguments remain unchanged) ...

  - type: files
    files:
      - source: system/etc
        destination: /etc
      - source: system/var
        destination: /var
      - source: system/usr/share
        destination: /usr/share
      - source: etc/skel
        destination: /etc/skel
      - source: etc/flatpak/overrides/ai.lmstudio.lm-studio
        destination: /etc/flatpak/overrides/ai.lmstudio.lm-studio

  - type: systemd
    system:
      enabled:
        - scx_loader.service
        - usbguard.service
        - cockpit.socket

  - type: justfiles
    validate: false

  - type: script
    scripts:
      - theming.sh
      - install-intel-sde.sh
      - install-apple2pi.sh
      - install-tether.sh
      - install-hotline.sh
      - install-snow.sh
      - install-fono.sh
      - install-icloud-linux.sh
      - install-cunai.sh
      - install-smb-remastered.sh
      - install-beets.sh
      - install-zaparoo.sh
      - configure-stellarium.sh
      - install-sumer-r-package.sh
      - cuneiform-toggle.sh   # <-- CORRECTED: was 'compile-cuneiform-ibus.sh'
      - enable-vaapi.sh
      - install-daggerfall-unity.sh
      - install-soh.sh
      - install-2s2h.sh
      - install-samodmanager.sh

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          # ... (all your flatpaks remain unchanged) ...
