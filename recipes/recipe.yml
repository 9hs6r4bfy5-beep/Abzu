---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: Abzû
# description will be included in the image's metadata
description: An elegant, powerful operating system for desktops, workstations and homelabs that honours and preserves the ancient traditions.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/secureblue/silverblue-main-hardened
image-version: latest # You can pin to a specific version of Fedora as well

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
- type: rpm-ostree
   repos:
      - copr:bieszczaders/kernel-cachyos-addons
   install:
      # Base build tools and dependencies
      - git
      - wget
      - gcc
      - make
      - podman
      - podman-compose
      - python3-devel
      - fuse
      - fuse-libs
      - fuse-devel
      - R
      - libxml2-devel
      - openssl-devel
      - libcurl-devel
      - libpng-devel
      - freetype-devel
      - harfbuzz-devel
      - fribidi-devel
      - libtiff-devel
      - libjpeg-turbo-devel
      - curl
      - wine
      - winetricks
      - p7zip
      - unzip
      - desktop-file-utils
      - gnutls
      - gnutls.i686
      - jq
      - dconf-editor
      - gnome-tweaks
      - gnome-shell-extensions
      - scx-scheds
      - scx-tools
      # Fonts and utilities
      - gdouros-akkadian-fonts
      - sassc
      - gtk-murrine-engine
      - gnome-themes-extra
      # Hardware Support
      - akmod-wl
      - akmod-nvidia
      # Other packages
      - intel-sde
      # Sumerian / Cuneiform tools
      - yagf
      - cuneiform-qt
      - gdouros-akkadian-fonts
      # ibus dependencies for cuneiform input method
      - ibus
      - ibus-table
      - python3
      # Build tools for Tauri
      - nodejs
      - npm
      - cargo
      - rust
      - webkit2gtk4.1-devel
      - openssl-devel
      - libappindicator-gtk3-devel
      - librsvg2-devel
      - gtk3-devel
      - libxdo-devel
      - file
      # Build dependencies for Snow
      - alsa-lib-devel
      - pkgconf-pkg-config
      
 - type: kargs
    arch: x86_64, aarch64   # optional; omit to apply to all architectures
    kargs:
      - preempt=full
      - mitigations=auto
      - threadirqs
      
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /
      - source: etc/scx_loader/config.toml
        destination: /etc/scx_loader/config.toml
      - source: etc/dconf/db/local.d/00-macos-themes
        destination: /etc/dconf/db/local.d/00-macos-themes
      - source: etc/udev/rules.d/50-usb-serial.rules
        destination: /etc/udev/rules.d/50-usb-serial.rules
      - source: etc/skel/.config/fono/config.toml
        destination: /etc/skel/.config/fono/config.toml
      - source: etc/skel/.config/fono/secrets.toml
        destination: /etc/skel/.config/fono/secrets.toml  
      - source: etc/skel/.config/zaparoo/config.toml
        destination: /etc/skel/.config/zaparoo/config.toml
      - source: usr/local/bin/picocalc
        destination: /usr/local/bin/picocalc
      - source: usr/share/applications/picocalc.desktop
        destination: /usr/share/applications/picocalc.desktop
      - source: etc/skel/.config/autostart/hidamari.desktop
        destination: /etc/skel/.config/autostart/hidamari.desktop
      - source: etc/skel/.config/systemd/user/ground-station.service
        destination: /etc/skel/.config/systemd/user/ground-station.service
      - source: usr/share/applications/ground-station.desktop
        destination: /usr/share/applications/ground-station.desktop
      - source: etc/flatpak/overrides/ai.lmstudio.lm-studio
        destination: /etc/flatpak/overrides/ai.lmstudio.lm-studio
      - source: usr/share/ublue-os/just/60-custom.just
        destination: /usr/share/ublue-os/just/60-custom.just
        
  - type: systemd
    system:
      enabled:
        - scx_loader.service      
        
 - type: script
    scripts:
      - theming.sh
      - install-apple2pi.sh
      - install-hotline.sh
      - install-snow.sh
      - install-fono.sh
      - install-icloud-linux.sh
      - install-smb-remastered.sh
      - install-zaparoo.sh
      - configure-stellarium.sh
      - install-ibus-cuneiform.sh
      - install-sumer-r-package.sh
      - install-daggerfall-unity.sh
      - install-soh.sh
      - install-2s2h.sh
      - install-samodmanager.sh
  - type: dnf
    repos:
      copr:
        - atim/starship
        
    install:
      packages:
        - micro
        - starship
    remove:
      packages: 
        - firefox
        - firefox-langpacks

  - type: default-flatpaks
    configurations:
      - notify: true # Send notification after install/uninstall is finished (true/false)
        scope: system
        # If no repo information is specified, Flathub will be used by default
        install: # system flatpaks we want all users to have and not remove
          - app.twintaillauncher.ttl
          - io.github.jeffshee.Hidamari
          - net.waterfox.waterfox
          - org.torproject.torbrowser-launcher
          - org.freedownloadmanager.Manager
          - io.github.heidefinnischen.cuneo
          - as.may.moat
          - io.github.kolunmi.Bazaar
          - org.gnome.Loupe
          - com.visualstudio.code
          - ai.lmstudio.lm-studio
          - com.valvesoftware.Steam
          - com.valvesoftware.Steam.CompatibilityTool.Proton
          - com.valvesoftware.Steam.Utility.steamtinkerlaunch
          - org.openmw.OpenMW
          - com.infochunk.OpenMadoola
          - io.jor.nanosaur
          - io.jor.nanosaur2
          - io.github.hedge_dev.hedgemodmanager
          - com.epicgames.ut99
          - com.epicgames.ut2004
          - com.vysp3r.ProtonPlus
          - com.github.Matoking.protontricks
          - io.github.sharkwouter.Minigalaxy
          - com.discordapp.Discord
          - org.lyx.LyX
          - dk.gqrx.gqrx
          - org.audacityteam.Audacity
          - org.kde.krita
          - org.kde.haruna
          - org.stellarium.Stellarium
          
      - scope: user # Also add Flathub user repo, but no user packages

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
