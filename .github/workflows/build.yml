name: bluebuild
on:
  schedule:
    - cron:
        "00 06 * * *" # build at 06:00 UTC every day
        # (20 minutes after last ublue images start building)
  push:
    paths-ignore: # don't rebuild if only documentation has changed
      - "**.md"

  pull_request:
  workflow_dispatch: # allow manually triggering builds
concurrency:
  # only run one build at a time
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  bluebuild:
    name: Build Custom Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      matrix:
        recipe:
          # !! Add your recipes here
          - recipe.yml
    steps:
      # We run free-disk-space ourselves here, before adding swap, with
      # swapoff: false. The version BlueBuild calls internally sets
      # swapoff: true, which would disable the swap we are about to add.
      - name: Free disk space
        uses: hastd/free-disk-space@68572aeaadb7f76bd408246328e95926323402b5
        with:
          swapoff: false

      # Add 16 GiB of swap. The Rust/Tauri release build of hotline-tauri
      # links OpenSSL, aws-lc, ring, libsodium, tokio, reqwest, tauri and
      # rustls into a single crate. LLVM's optimizer on that crate
      # exceeds the runner's 16 GiB of RAM and aborts with
      # "rustc-LLVM ERROR: out of memory / Allocation failed".
      # Swap gives LLVM room to spill instead of crashing.
      #
      # This step is idempotent: it handles a stale /swapfile left over
      # from a previous run (which would otherwise cause "Text file busy")
      # by first disabling and removing any existing swap file.
      - name: Add 16 GiB swap
        run: |
          echo "--- Before: memory and swap ---"
          free -h
          swapon --show || true

          # If /swapfile already exists, disable and remove it first.
          if swapon --show=NAME --noheadings | grep -q '^/swapfile$'; then
            echo "Disabling existing swap at /swapfile"
            sudo swapoff /swapfile
          fi
          if [ -e /swapfile ]; then
            echo "Removing existing /swapfile"
            sudo rm -f /swapfile
          fi

          # Create a fresh 16 GiB swap file. Prefer fallocate; fall back
          # to dd on filesystems where fallocate is unsupported.
          echo "Creating /swapfile (16 GiB)"
          sudo fallocate -l 16G /swapfile \
            || sudo dd if=/dev/zero of=/swapfile bs=1M count=16384 status=progress
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo sysctl vm.swappiness=60

          echo "--- After: memory and swap ---"
          free -h
          swapon --show

      # the build is fully handled by the reusable github action
      - name: Build Custom Image
        uses: blue-build/github-action@v1.11
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}

          # We already ran free-disk-space ourselves above. Setting this
          # to false prevents the BlueBuild action from running it again
          # (which would call `swapoff -a` and kill our newly-added swap).
          maximize_build_space: false
          # trigger workflow detection
