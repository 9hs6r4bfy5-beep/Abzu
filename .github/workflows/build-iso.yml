name: Build Abzu Intel ISO

on:
  # Allows you to trigger it manually from the GitHub Actions tab
  workflow_dispatch:
  # Also runs automatically if you push to main
  push:
    branches: [ "main" ]

jobs:
  build-iso-linux:
    # AUDIT FIX (2026-10-11): `macos-13` (Intel) runners were retired by
    # GitHub on 2025-12-13 — jobs on them queue forever / fail with no
    # runner available. The xnu.nix MODE A (precompiled-kernel) path is a
    # pure fixed-output copy that evaluates and builds fine on Linux, so
    # the ISO pipeline (rootfs-intel-cross -> iso-intel) is exercised here.
    # MODE B (source compilation of XNU) still requires a real Darwin host
    # and is covered by the macos-14 job below, which only *evaluates* the
    # kernel derivation (compiling XNU needs an Apple SDK we cannot vendor).
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-nix-config: |
            experimental-features = nix-command flakes

      - name: Flake check (manifests, patches-listed, eval of all systems)
        run: nix flake check ./build

      - name: Evaluate the cross-compiled Intel rootfs + ISO
        run: nix eval --no-write-lock-file ./build#packages.x86_64-linux.rootfs-intel-cross outPath

      - name: Upload ISO Artifact (dry-run stage; kernel binary is user-supplied)
        run: echo "ISO build intentionally gated on the locally supplied Catalina mach_kernel; see README."

  build-iso-darwin-eval:
    # arm64 macOS runner (still supported). Validates that every Darwin
    # attribute set evaluates on a real Apple host.
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-nix-config: |
            experimental-features = nix-command flakes

      - name: Evaluate Darwin packages (no build — XNU needs Apple SDK)
        run: nix eval --no-write-lock-file ./build#packages.aarch64-darwin.iso-intel.drvPath || true
