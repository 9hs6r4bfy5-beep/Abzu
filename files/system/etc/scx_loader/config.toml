# /etc/scx_loader/config.toml
# Configuration for scx_loader — manages sched-ext schedulers on Abzu

[default]
# The scheduler to load by default at boot
sched = "scx_lavd"

# Mode for scx_lavd: "auto", "gaming", "lowlatency", or "powersave"
# "gaming" sets -m performance for maximum gaming responsiveness
mode = "gaming"

# Optional: additional raw flags passed to the scheduler
# For scx_lavd gaming mode, the default flags are already optimized.
# Uncomment and adjust only if you need custom tuning.
# flags = []
