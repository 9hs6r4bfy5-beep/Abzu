# Disable rarely-used network and filesystem protocols to reduce
# kernel attack surface. None of these are needed on a desktop or
# workstation running Abzu.
blacklist dccp
blacklist sctp
blacklist rds
blacklist tipc
blacklist n-hdlc
blacklist ax25
blacklist netrom
blacklist x25
blacklist rose
blacklist decnet
blacklist econet
blacklist af_802154
blacklist ipx
blacklist appletalk
blacklist psnap
blacklist p8022
blacklist p8023
blacklist can
blacklist atm
