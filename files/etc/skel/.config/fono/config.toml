# ~/.config/fono/config.toml

# Pre-configured for LM Studio running as a Flatpak on localhost:1234

[polish]

backend = "network"

[polish.network]

url = "http://localhost:1234/v1/chat/completions"

model = "your-lm-studio-model-name"

# api_key_ref = "LM_STUDIO_TOKEN" # only if you enable authentication in LM Studio

[assistant]

backend = "network"

[assistant.network]

url = "http://localhost:1234/v1/chat/completions"

model = "your-lm-studio-model-name"

# api_key_ref = "LM_STUDIO_TOKEN"
