# $Abzu: etc/login.conf -- login.capability(5) database, OpenBSD-derived.
# ---------------------------------------------------------------------------
# Darwin's login(1)/getty chain and our ported doas(1) read this file the same
# way OpenBSD does; macOS normally keeps these settings in OpenDirectory, which
# Abzu deliberately does not use (local-file auth only -- see
# docs/OPENBSD-DIFFS.md section B3).
#
# Installed to /etc/login.conf by build/scripts/assemble-rootfs.sh; abzu-init
# runs `pwd_mkdb -p /etc/master.passwd` at first boot.

# ---- default: interactive users ---------------------------------------------
default:\
	:umask=022:\
	:setenv=LC_CTYPE=UTF-8,TERM=xterm-256color,PATH=/bin:/sbin:/usr/bin:/usr/sbin:/usr/local/bin:/usr/local/sbin:\
	:ignoredeny:\
	:datasize-max=all:\
	:datasize-cur=4096M:\
	:maxproc-max=512:\
	:maxproc-cur=256:\
	:stacksize-cur=32M:\
	:openfiles-cur=4096:\
	:tc=auth-defaults:

# ---- daemon: service processes started by launchd ----------------------------
# rlimits are the backstop; /etc/sandbox.d profiles do the real narrowing.
daemon:\
	:datasize-max=2048M:\
	:datasize-cur=1024M:\
	:maxmemorysize-cur=1024M:\
	:maxproc-max=128:\
	:maxproc-cur=64:\
	:openfiles-cur=1024:\
	:priority=10:\
	:umask=027:\
	:tc=auth-defaults:

# ---- auth: doas / passwd helpers ---------------------------------------------
auth:\
	:datasize-cur=512M:\
	:maxproc-cur=64:\
	:openfiles-cur=256:\
	:ignoredeny:\
	:requirehomedir=false:

# ---- GUI session (GNUstep / GWorkspace shell) --------------------------------
xterm|gnustep:\
	:setenv=LC_CTYPE=UTF-8,TERM=xterm-256color,LANG=en_US.UTF-8:\
	:umask=022:\
	:tc=auth-defaults:

# ---- internal service accounts (must match etc/master.passwd) --------------
_www|_ntp|_unbound|_sshd|_relayd:\
	:datasize-cur=256M:\
	:maxproc-cur=32:\
	:openfiles-cur=256:\
	:priority=10:\
	:umask=077:\
	:tc=daemon:
