# $Abzu: etc/syslog.conf -- OpenBSD-style facility routing for ported syslogd.
# Darwin facility numbering differs slightly; see docs/OPENBSD-DIFFS.md section B5.
#
# NOTE: kern.* cannot be fully routed until the XNU os_log bridge lands (roadmap
# M4); until then kernel text reaches /var/log/kernel via the console reader only.

auth.*;authpriv.*				/var/log/auth
daemon.info						/var/log/daemon
kern.err						/var/log/kernel
lpr.err						/var/log/lpd-errs
mail.debug					/var/log/maillog
security.*						/var/log/security
user.err						/var/log/messages
cron.*						/var/log/cron
*.emerg						*
