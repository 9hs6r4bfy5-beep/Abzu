# $Abzu: etc/doas.conf — OpenBSD-style privilege policy shipped as the default.
# sudo is intentionally absent from the image (docs/OPENBSD-DIFFS.md section B3).
#
# Syntax notes for the ported parser (usr.bin/doas):
#   * groups are prefixed with ':' ; users are bare names
#   * 'persist' caches auth for the tty session (implemented with getpeereid(3)
#     against our launchd-owned agent, NOT with PAM)
#   * the final 'deny' is a catch-all: unlisted principals get EPERM silently
#
# Order matters: first match wins.

# wheel members may become root, keeping their environment, persistently
permit keepenv persist :wheel

# homelab operators may reboot/shutdown without a password
permit nopass :operator as root cmd /usr/sbin/shutdown
permit nopass :operator as root cmd /usr/sbin/reboot

# service management is explicitly allowed for wheel without env leakage
permit setenv { PATH=/usr/bin:/bin:/usr/sbin:/sbin } :wheel cmd /usr/local/bin/abzu-ctl args status

# the unprivileged network probe used by the GUI connectivity panel
permit nopass _www as root cmd /usr/bin/nc args -z -w 3 localhost 53

# package installs go through abzu-pkg, never through a shell
permit :wheel cmd /usr/local/bin/abzu-pkg args install

deny
